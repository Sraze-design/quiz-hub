<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wake & Study Stopwatch</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(470px,94vw);padding:24px 14px}
h1{text-align:center;font-size:22px;margin:0 0 18px}
.box{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:18px;margin:12px 0}
.title{font-size:17px;font-weight:600;margin-bottom:8px}
.time{font-variant-numeric:tabular-nums;font-size:42px;font-weight:600;letter-spacing:-1px;margin:8px 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
button{border:0;border-radius:13px;padding:12px 16px;font-size:15px;font-weight:600;min-width:92px}
.toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.toggle svg{width:18px;height:18px;display:block;flex:0 0 18px;fill:currentColor}
.start{background:#fff;color:#111}.stop{background:#ff6868;color:#111}.reset{background:#ddd;color:#111;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.reset svg{width:18px;height:18px;display:block;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reset.resetting svg{animation:resetSpin .45s ease}
@keyframes resetSpin{0%{transform:rotate(0)}60%{transform:rotate(-150deg) scale(.92)}100%{transform:rotate(-360deg) scale(1)}}
.pip{background:#4ade80;color:#111;width:100%;margin-top:12px}
.status{text-align:center;color:#aaa;font-size:13px;min-height:20px;margin-top:10px}
.hint{text-align:center;color:#999;font-size:12px;line-height:1.45;margin-top:14px}
#pipCanvas{position:fixed;left:4px;bottom:4px;width:2px;height:1px;opacity:.02;pointer-events:none}
#pipVideo{position:fixed;left:8px;bottom:8px;width:2px;height:1px;opacity:.02;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal.show{display:flex}
.modalBox{width:min(360px,92vw);background:#1b1b1b;border:1px solid #3a3a3a;border-radius:18px;padding:22px;box-shadow:0 16px 50px rgba(0,0,0,.45)}
.modalTitle{font-size:20px;font-weight:700;margin-bottom:8px}
.modalText{font-size:15px;color:#bbb;line-height:1.4;margin-bottom:20px}
.modalActions{display:flex;gap:10px}
.modalActions button{flex:1;min-width:0}
.modalNo{background:#ddd;color:#111}
.modalYes{background:#ff6868;color:#111}
</style>
</head>
<body>
<div class="wrap">
<h1>Wake & Study Stopwatch</h1>

<div class="box">
  <div class="title">📚 Study Time</div>
  <div id="studyTime" class="time">00:00:00</div>
  <div class="row">
    <button type="button" id="studyToggle" class="start toggle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5z"/></svg>
      <span>Start</span>
    </button>
    <button type="button" id="studyReset" class="reset">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10A7.5 7.5 0 1 1 6.7 16"/><path d="M4.5 10V5.5"/><path d="M4.5 10H9"/></svg>
      <span>Reset</span>
    </button>
  </div>
</div>

<div class="box">
  <div class="title">🌅 Awake Time</div>
  <div id="wakeTime" class="time">00:00:00</div>
  <div class="row">
    <button type="button" id="wakeToggle" class="start toggle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5z"/></svg>
      <span>Start</span>
    </button>
    <button type="button" id="wakeReset" class="reset">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10A7.5 7.5 0 1 1 6.7 16"/><path d="M4.5 10V5.5"/><path d="M4.5 10H9"/></svg>
      <span>Reset</span>
    </button>
  </div>
</div>

<button type="button" id="pip" class="pip">Open PiP</button>
<div id="status" class="status"></div>
<div class="hint">
  Awake Time can run continuously from the moment you wake up.<br>
  Study Time can be started/stopped for each study session and accumulates total study time.
</div>
</div>

<canvas id="pipCanvas" width="1400" height="440"></canvas>
<video id="pipVideo" playsinline autoplay muted></video>

<script>
const KEY="wake_study_stopwatch_v1";

let state;
try { state=JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e) {}
if(!state){
  state={
    wake:{running:false,startTime:null,elapsed:0},
    study:{running:false,startTime:null,elapsed:0}
  };
}

const $=id=>document.getElementById(id);
const wakeTime=$("wakeTime"),studyTime=$("studyTime");
const wakeToggle=$("wakeToggle"),wakeReset=$("wakeReset");
const studyToggle=$("studyToggle"),studyReset=$("studyReset");
const pipBtn=$("pip"),statusEl=$("status"),canvas=$("pipCanvas"),video=$("pipVideo");
const resetModal=$("resetModal"),resetCancel=$("resetCancel"),resetConfirm=$("resetConfirm");
const ctx=canvas.getContext("2d");
let pendingReset=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state));}

function elapsed(t){
  if(t.running && t.startTime) return t.elapsed+(Date.now()-t.startTime);
  return t.elapsed;
}

function fmt(ms){
  let s=Math.floor(ms/1000);
  const h=Math.floor(s/3600); s%=3600;
  const m=Math.floor(s/60), sec=s%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function startTimer(t){
  if(!t.running){
    t.running=true;
    t.startTime=Date.now();
    save();
  }
}

function stopTimer(t){
  if(t.running){
    t.elapsed=elapsed(t);
    t.running=false;
    t.startTime=null;
    save();
  }
}

function resetTimer(name){
  state[name]={running:false,startTime:null,elapsed:0};
  save();

  const btn=name==="wake"?wakeReset:studyReset;
  btn.classList.remove("resetting");
  void btn.offsetWidth;
  btn.classList.add("resetting");
  setTimeout(()=>btn.classList.remove("resetting"),500);
}

wakeToggle.addEventListener("click",()=>{
  if(state.wake.running) stopTimer(state.wake);
  else startTimer(state.wake);
  render();
});
wakeReset.addEventListener("click",()=>{
  pendingReset="wake";
  resetModal.classList.add("show");
  resetModal.setAttribute("aria-hidden","false");
});

studyToggle.addEventListener("click",()=>{
  if(state.study.running) stopTimer(state.study);
  else startTimer(state.study);
  render();
});
studyReset.addEventListener("click",()=>{
  pendingReset="study";
  resetModal.classList.add("show");
  resetModal.setAttribute("aria-hidden","false");
});

function closeResetModal(){
  pendingReset=null;
  resetModal.classList.remove("show");
  resetModal.setAttribute("aria-hidden","true");
}

resetCancel.addEventListener("click",closeResetModal);

resetConfirm.addEventListener("click",()=>{
  if(pendingReset) resetTimer(pendingReset);
  closeResetModal();
  render();
});

resetModal.addEventListener("click",(e)=>{
  if(e.target===resetModal) closeResetModal();
});

function setToggleButton(btn,running){
  btn.className=(running?"stop":"start")+" toggle";
  btn.innerHTML=running
    ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5h3.5v13H7zM13.5 5.5H17v13h-3.5z"/></svg><span>Stop</span>'
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5z"/></svg><span>Start</span>';
}

function render(){
  wakeTime.textContent=fmt(elapsed(state.wake));
  studyTime.textContent=fmt(elapsed(state.study));

  setToggleButton(wakeToggle,state.wake.running);
  setToggleButton(studyToggle,state.study.running);

  drawPiP();
}

function drawPiP(){
  ctx.fillStyle="#111";
  ctx.fillRect(0,0,1400,440);

  ctx.fillStyle="#aaa";
  ctx.font='600 42px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif';
  ctx.textAlign="left";
  ctx.fillText("STUDY",56,80);
  ctx.fillText("AWAKE",56,284);

  ctx.fillStyle="#fff";
  ctx.font='600 92px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif';
  ctx.textAlign="right";
  ctx.fillText(fmt(elapsed(state.study)),1344,96);
  ctx.fillText(fmt(elapsed(state.wake)),1344,300);

  ctx.fillStyle="#777";
  ctx.fillRect(56,182,1288,4);
}

let streamReady=false;
let syncingVideo=false;

/*
 Native PiP center Play/Pause controls STUDY TIME.
 Both timers remain visible in the PiP display.
 The two timers can always be independently controlled from the webpage.
*/
video.addEventListener("pause",()=>{
  if(syncingVideo)return;
  stopTimer(state.study);
  render();
});

video.addEventListener("play",()=>{
  if(syncingVideo)return;
  startTimer(state.study);
  render();
});

async function preparePiP(){
  render();

  if(!streamReady){
    if(!canvas.captureStream)throw new Error("Canvas captureStream is not supported");
    const stream=canvas.captureStream(10);
    video.srcObject=stream;
    video.muted=true;
    video.playsInline=true;
    video.setAttribute("playsinline","");
    video.setAttribute("autoplay","");

    syncingVideo=true;
    try{await video.play();}finally{syncingVideo=false;}

    await new Promise(r=>setTimeout(r,1000));
    streamReady=true;
  }

  if(video.webkitSupportsPresentationMode &&
     video.webkitSupportsPresentationMode("picture-in-picture") &&
     typeof video.webkitSetPresentationMode==="function"){
    video.webkitSetPresentationMode("picture-in-picture");
    return;
  }

  if(document.pictureInPictureEnabled &&
     typeof video.requestPictureInPicture==="function"){
    await video.requestPictureInPicture();
    return;
  }

  throw new Error("PiP is not available in this browser");
}

pipBtn.addEventListener("click",async()=>{
  statusEl.textContent="Opening PiP…";
  try{
    await preparePiP();
    statusEl.textContent="PiP opened • Study ऊपर, Awake नीचे";
  }catch(e){
    console.error(e);
    statusEl.textContent="PiP failed: "+(e.message||e.name);
  }
});

setInterval(render,250);
document.addEventListener("visibilitychange",render);
window.addEventListener("pageshow",render);
render();
</script>
</body>
</html>
