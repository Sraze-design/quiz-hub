<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Floating Stopwatch</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center
}
.card{width:min(430px,92vw);text-align:center;padding:28px 18px}
h1{font-size:22px;margin:0 0 22px}
#time{
  font-variant-numeric:tabular-nums;font-size:52px;font-weight:600;
  letter-spacing:-1px;margin:10px 0 26px
}
button{
  border:0;border-radius:14px;padding:13px 18px;margin:5px;
  font-size:16px;font-weight:600;min-width:92px
}
.start{background:#fff;color:#111}.stop{background:#ff6868;color:#111}
.reset{background:#ddd;color:#111}.pip{background:#4ade80;color:#111}
button:disabled{opacity:.4}
#status{margin-top:14px;font-size:13px;color:#aaa;min-height:20px}
.hint{font-size:13px;line-height:1.5;color:#999;margin-top:18px}

/* Keep the source rendered on-screen. Some iPadOS Safari builds give a
   blank PiP stream when the canvas/video is completely off-screen/display:none. */
#pipCanvas{
  position:fixed;left:4px;bottom:4px;width:2px;height:1px;
  opacity:.02;pointer-events:none
}
#pipVideo{
  position:fixed;left:8px;bottom:8px;width:2px;height:1px;
  opacity:.02;pointer-events:none
}
</style>
</head>
<body>
<div class="card">
  <h1>Floating Stopwatch</h1>
  <div id="time">00:00:00</div>

  <div>
    <button id="start" class="start">Start</button>
    <button id="stop" class="stop" disabled>Stop</button>
    <button id="reset" class="reset">Reset</button>
  </div>

  <button id="pip" class="pip">Open PiP</button>
  <div id="status"></div>

  <div class="hint">
    Start once. Removing PiP, leaving Safari, or closing the page does not
    stop the stopwatch. It stops only when you press Stop.
  </div>
</div>

<canvas id="pipCanvas" width="960" height="240"></canvas>
<video id="pipVideo" playsinline autoplay muted></video>

<script>
const KEY="floating_stopwatch_v4";

let state;
try { state=JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e) {}
if(!state){
  state={status:"stopped",startTime:null,elapsed:0};
}

const $=id=>document.getElementById(id);
const timeEl=$("time");
const startBtn=$("start");
const stopBtn=$("stop");
const resetBtn=$("reset");
const pipBtn=$("pip");
const statusEl=$("status");
const canvas=$("pipCanvas");
const video=$("pipVideo");
const ctx=canvas.getContext("2d");

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}

function elapsed(){
  if(state.status==="running" && state.startTime){
    return state.elapsed + (Date.now()-state.startTime);
  }
  return state.elapsed;
}

/* HH:MM:SS */
function fmt(ms){
  let totalSeconds=Math.floor(ms/1000);
  const h=Math.floor(totalSeconds/3600);
  totalSeconds%=3600;
  const m=Math.floor(totalSeconds/60);
  const s=totalSeconds%60;

  return String(h).padStart(2,"0")+":"+
         String(m).padStart(2,"0")+":"+
         String(s).padStart(2,"0");
}

function draw(text){
  /* Large source canvas so the PiP window has a clean readable frame. */
  ctx.fillStyle="#111";
  ctx.fillRect(0,0,960,240);

  ctx.fillStyle="#fff";
  ctx.font='600 132px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif';
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(text,480,120);
}

function render(){
  const t=fmt(elapsed());
  timeEl.textContent=t;
  draw(t);

  startBtn.disabled=state.status==="running";
  stopBtn.disabled=state.status!=="running";
}

startBtn.onclick=()=>{
  if(state.status!=="running"){
    state.status="running";
    state.startTime=Date.now();
    save();
    render();
  }
};

stopBtn.onclick=()=>{
  if(state.status==="running"){
    state.elapsed=elapsed();
    state.startTime=null;
    state.status="stopped";
    save();
    render();
  }
};

resetBtn.onclick=()=>{
  state={status:"stopped",startTime:null,elapsed:0};
  save();
  render();
};

let streamReady=false;

async function preparePiP(){
  render();

  if(!streamReady){
    if(!canvas.captureStream){
      throw new Error("Canvas captureStream is not supported");
    }

    const stream=canvas.captureStream(10);
    video.srcObject=stream;
    video.muted=true;
    video.playsInline=true;
    video.setAttribute("playsinline","");
    video.setAttribute("autoplay","");

    await video.play();

    /* iPadOS Safari needs a little time to receive the first frames. */
    await new Promise(resolve=>setTimeout(resolve,1000));

    streamReady=true;
  }

  /* WebKit/iPadOS route */
  if(video.webkitSupportsPresentationMode &&
     video.webkitSupportsPresentationMode("picture-in-picture") &&
     typeof video.webkitSetPresentationMode==="function"){
    video.webkitSetPresentationMode("picture-in-picture");
    return;
  }

  /* Standard route */
  if(document.pictureInPictureEnabled &&
     typeof video.requestPictureInPicture==="function"){
    await video.requestPictureInPicture();
    return;
  }

  throw new Error("PiP is not available in this browser");
}

pipBtn.onclick=async()=>{
  statusEl.textContent="Opening PiP…";
  try{
    await preparePiP();
    statusEl.textContent="PiP opened";
  }catch(e){
    console.error(e);
    statusEl.textContent="PiP failed: "+(e.message||e.name);
  }
};

/* Keep the stopwatch display and PiP source frame updated. */
setInterval(render,250);
render();
</script>
</body>
</html>
