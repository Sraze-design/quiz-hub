<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Floating Stopwatch</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
  }
  .card{width:min(420px,92vw);text-align:center;padding:28px 18px}
  h1{font-size:22px;margin:0 0 22px}
  #time{font-variant-numeric:tabular-nums;font-size:52px;font-weight:600;letter-spacing:-2px;margin:10px 0 28px}
  button{
    border:0;border-radius:14px;padding:13px 18px;margin:5px;font-size:16px;font-weight:600;
    background:#fff;color:#111;min-width:90px;
  }
  button:disabled{opacity:.4}
  .pip{background:#4ade80}
  .stop{background:#ff6b6b}
  .reset{background:#ddd}
  .hint{font-size:13px;line-height:1.5;color:#aaa;margin-top:20px}
  #pipVideo{
    position:fixed;left:-9999px;top:-9999px;width:320px;height:90px;
    background:#111;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Floating Stopwatch</h1>
  <div id="time">00:00</div>
  <div>
    <button id="start">Start</button>
    <button id="stop" class="stop" disabled>Stop</button>
    <button id="reset" class="reset">Reset</button>
  </div>
  <div>
    <button id="pip" class="pip">Open PiP</button>
  </div>
  <div class="hint">
    Start once. You can leave/close Safari and reopen this page later;
    the running stopwatch is recovered from its saved start time.
  </div>
</div>

<canvas id="canvas" width="640" height="180" style="display:none"></canvas>
<video id="pipVideo" playsinline muted></video>

<script>
const KEY="floating_stopwatch_v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
  status:"stopped", startTime:null, elapsed:0
};

const timeEl=document.getElementById("time");
const startBtn=document.getElementById("start");
const stopBtn=document.getElementById("stop");
const resetBtn=document.getElementById("reset");
const pipBtn=document.getElementById("pip");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const video=document.getElementById("pipVideo");

function save(){localStorage.setItem(KEY,JSON.stringify(state));}

function elapsed(){
  if(state.status==="running" && state.startTime)
    return state.elapsed + (Date.now()-state.startTime);
  return state.elapsed;
}

function fmt(ms){
  let s=Math.floor(ms/1000);
  let h=Math.floor(s/3600); s%=3600;
  let m=Math.floor(s/60); s%=60;
  return h ? String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")
           : String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function render(){
  const t=fmt(elapsed());
  timeEl.textContent=t;
  startBtn.disabled=state.status==="running";
  stopBtn.disabled=state.status!=="running";
  drawPiP(t);
}

function drawPiP(t){
  ctx.fillStyle="#111"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#fff";
  ctx.font='600 72px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif';
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(t,canvas.width/2,canvas.height/2);
}

startBtn.onclick=()=>{
  if(state.status!=="running"){
    state.status="running";
    state.startTime=Date.now();
    save(); render();
  }
};

stopBtn.onclick=()=>{
  if(state.status==="running"){
    state.elapsed=elapsed();
    state.startTime=null;
    state.status="stopped";
    save(); render();
  }
};

resetBtn.onclick=()=>{
  state={status:"stopped",startTime:null,elapsed:0};
  save(); render();
};

pipBtn.onclick=async()=>{
  try{
    if(!document.pictureInPictureEnabled || !video.requestPictureInPicture){
      alert("This browser does not expose the required PiP API.");
      return;
    }

    // Capture the canvas as a media stream for Safari PiP.
    if(!video.srcObject){
      const stream=canvas.captureStream(2);
      video.srcObject=stream;
      await video.play();
    }

    await video.requestPictureInPicture();
  }catch(e){
    console.error(e);
    alert("PiP could not be opened on this iPad/browser. The stopwatch itself will still work.");
  }
};

document.addEventListener("visibilitychange",()=>{
  // No timer is kept alive in the background.
  // The saved startTime is the source of truth.
  render();
});

render();
setInterval(render,250);
</script>
</body>
</html>
