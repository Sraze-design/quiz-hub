name: Export Full Quiz Hub ZIP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/export-railway-typewise.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage full repository
        run: |
          mkdir -p export/quiz-hub
          rsync -a --exclude='.git' ./ export/quiz-hub/

      - name: Upload full repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: quiz-hub-complete
          path: export/quiz-hub
          if-no-files-found: error
          retention-days: 1
