name: Update Quiz Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'index.json'
  workflow_dispatch:

concurrency:
  group: update-quiz-index-main
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate and update index.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/build-index.js
            git add index.json

            if git diff --cached --quiet; then
              echo "index.json is already up to date."
              exit 0
            fi

            git commit -m "Auto update index.json"

            if git push origin HEAD:main; then
              echo "index.json updated successfully."
              exit 0
            fi

            echo "Push conflicted with a newer commit. Retrying with latest main..."
            sleep 2
          done

          echo "Failed to update index.json after 3 attempts."
          exit 1
