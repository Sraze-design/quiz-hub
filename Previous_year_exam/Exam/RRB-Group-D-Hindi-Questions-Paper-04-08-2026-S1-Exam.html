let currentLang = "hi";
let showAnswers = false;
const app = document.getElementById("app");
const hiBtn = document.getElementById("hiBtn");
const enBtn = document.getElementById("enBtn");
const ansBtn = document.getElementById("ansBtn");

function render(){
  app.innerHTML = data.map((q) => {
    const question = currentLang === "hi" ? q.q_hi : q.q_en;
    const opts = currentLang === "hi" ? q.o_hi : q.o_en;
    const exp = currentLang === "hi" ? q.e_hi : q.e_en;
    const answerText = opts[q.a];
    return `<section class="q">
      <div class="question">${question}</div>
      <div class="tag">${q.tag}</div>
      <ul class="opts">${opts.map(o => `<li class="opt">${o}</li>`).join("")}</ul>
      <div class="answer ${showAnswers ? "show" : ""}">
        <div class="correct">${currentLang === "hi" ? "सही उत्तर" : "Correct Answer"}: ${answerText}</div>
        <div class="exp">${exp}</div>
      </div>
    </section>`;
  }).join("");
}

hiBtn.addEventListener("click", () => { currentLang = "hi"; hiBtn.classList.add("active"); enBtn.classList.remove("active"); render(); });
enBtn.addEventListener("click", () => { currentLang = "en"; enBtn.classList.add("active"); hiBtn.classList.remove("active"); render(); });
ansBtn.addEventListener("click", () => { showAnswers = !showAnswers; ansBtn.textContent = showAnswers ? (currentLang === "hi" ? "उत्तर छिपाएँ" : "Hide Answers") : (currentLang === "hi" ? "उत्तर दिखाएँ" : "Show Answers"); render(); });
render();
</script>
