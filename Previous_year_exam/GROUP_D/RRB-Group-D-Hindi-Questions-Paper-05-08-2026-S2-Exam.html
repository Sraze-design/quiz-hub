let idx = 0;
let lang = 'hi';
const answered = new Map();
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const explEl = document.getElementById('explanation');
const countEl = document.getElementById('count');
const tagEl = document.getElementById('tag');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const hiBtn = document.getElementById('hiBtn');
const enBtn = document.getElementById('enBtn');

function render(){
  const q = data[idx];
  questionEl.innerHTML = lang === 'hi' ? q.q_hi : q.q_en;
  tagEl.textContent = q.tag;
  countEl.textContent = `${idx + 1} / ${data.length}`;
  optionsEl.innerHTML = '';
  const opts = lang === 'hi' ? q.o_hi : q.o_en;
  opts.forEach((text, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.innerHTML = text;
    b.addEventListener('click', () => choose(i));
    optionsEl.appendChild(b);
  });
  explEl.innerHTML = lang === 'hi' ? q.e_hi : q.e_en;
  explEl.classList.remove('show');
  if(answered.has(idx)) showAnswer(answered.get(idx));
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === data.length - 1;
}
function choose(selected){
  if(answered.has(idx)) return;
  answered.set(idx, selected);
  showAnswer(selected);
}
function showAnswer(selected){
  const q = data[idx];
  [...optionsEl.children].forEach((b,i) => {
    b.disabled = true;
    if(i === q.a) b.classList.add('correct');
    else if(i === selected) b.classList.add('wrong');
  });
  explEl.classList.add('show');
}
function setLang(v){
  lang=v;
  document.documentElement.lang = v === 'hi' ? 'hi' : 'en';
  hiBtn.classList.toggle('active', v==='hi');
  enBtn.classList.toggle('active', v==='en');
  render();
}
hiBtn.addEventListener('click',()=>setLang('hi'));
enBtn.addEventListener('click',()=>setLang('en'));
prevBtn.addEventListener('click',()=>{ if(idx>0){idx--;render();window.scrollTo({top:0,behavior:'smooth'});} });
nextBtn.addEventListener('click',()=>{ if(idx<data.length-1){idx++;render();window.scrollTo({top:0,behavior:'smooth'});} });
render();
</script>
