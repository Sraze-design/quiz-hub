let lang='hi';

function render(){
  app.innerHTML='';
  data.forEach((d,idx)=>{
    const card=document.createElement('section'); card.className='q';
    const q=document.createElement('div'); q.className='qt'; q.innerHTML=lang==='hi'?d.q_hi:d.q_en; card.appendChild(q);
    const tag=document.createElement('div'); tag.className='tag'; tag.textContent=d.tag; card.appendChild(tag);

    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=lang==='hi'?d.e_hi:d.e_en; det.appendChild(ex); card.appendChild(det); app.appendChild(card);
  });
}
hiBtn.onclick=()=>{lang='hi';hiBtn.classList.add('active');enBtn.classList.remove('active');render()};
enBtn.onclick=()=>{lang='en';enBtn.classList.add('active');hiBtn.classList.remove('active');render()};
render();
</script>
