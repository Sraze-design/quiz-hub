const app=document.getElementById('app');
document.getElementById('count').textContent=`${data.length}/100`;
function esc(s){return s;}
function render(){
  app.innerHTML=data.map((x,i)=>{
    const hiOpts=x.o_hi.map((o,j)=>`<div class="opt" data-correct="${j===x.a?1:0}">${esc(o)}</div>`).join('');
    const enOpts=x.o_en.map((o,j)=>`<div class="opt" data-correct="${j===x.a?1:0}">${esc(o)}</div>`).join('');
    return `<section class="card" id="q${i+1}">
      <div class="tag">${esc(x.tag||'')}</div>
      <div class="hi"><div class="q">${esc(x.q_hi)}</div><div class="opts">${hiOpts}</div><div class="ans"><b>Ans:</b> ${x.o_hi[x.a]}<br><b>Explanation:</b><br>${esc(x.e_hi)}</div></div>
      <div class="en"><div class="q">${esc(x.q_en)}</div><div class="opts">${enOpts}</div><div class="ans"><b>Ans:</b> ${x.o_en[x.a]}<br><b>Explanation:</b><br>${esc(x.e_en)}</div></div>
    </section>`;
  }).join('');
}
render();
const hiBtn=document.getElementById('hiBtn'), enBtn=document.getElementById('enBtn'), ansBtn=document.getElementById('ansBtn');
hiBtn.onclick=()=>{document.body.classList.remove('lang-en');hiBtn.classList.add('active');enBtn.classList.remove('active')};
enBtn.onclick=()=>{document.body.classList.add('lang-en');enBtn.classList.add('active');hiBtn.classList.remove('active')};
ansBtn.onclick=()=>{document.body.classList.toggle('show-answers');ansBtn.classList.toggle('active')};
</script>
