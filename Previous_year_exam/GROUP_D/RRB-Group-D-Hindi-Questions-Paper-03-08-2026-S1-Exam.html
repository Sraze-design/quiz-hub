let current = 0;
let lang = 'hi';
let selected = null;
const qEl=document.getElementById('question');
const oEl=document.getElementById('options');
const tagEl=document.getElementById('tag');
const countEl=document.getElementById('count');
const resultEl=document.getElementById('result');
const answerEl=document.getElementById('answer');
const expEl=document.getElementById('explanation');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const langBtn=document.getElementById('langBtn');
const showBtn=document.getElementById('showBtn');

function render(){
  const d=data[current];
  const q=lang==='hi'?d.q_hi:d.q_en;
  const opts=lang==='hi'?d.o_hi:d.o_en;
  const exp=lang==='hi'?d.e_hi:d.e_en;
  qEl.innerHTML=q;
  tagEl.textContent=d.tag;
  countEl.textContent=(current+1)+' / '+data.length;
  oEl.innerHTML='';
  opts.forEach((txt,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.innerHTML=txt;
    b.addEventListener('click',()=>{selected=i; showResult();});
    oEl.appendChild(b);
  });
  answerEl.textContent=(lang==='hi'?'सही उत्तर: ':'Correct answer: ')+opts[d.a];
  expEl.innerHTML=exp;
  resultEl.classList.remove('show');
  selected=null;
  prevBtn.disabled=current===0;
  nextBtn.disabled=current===data.length-1;
  langBtn.textContent=lang==='hi'?'English':'हिंदी';
}
function showResult(){
  const d=data[current];
  const btns=[...oEl.querySelectorAll('.option')];
  btns.forEach((b,i)=>{b.classList.remove('correct','wrong'); if(i===d.a)b.classList.add('correct');});
  if(selected!==null && selected!==d.a && btns[selected])btns[selected].classList.add('wrong');
  resultEl.classList.add('show');
}
prevBtn.addEventListener('click',()=>{if(current>0){current--;render();}});
nextBtn.addEventListener('click',()=>{if(current<data.length-1){current++;render();}});
langBtn.addEventListener('click',()=>{lang=lang==='hi'?'en':'hi';render();});
showBtn.addEventListener('click',showResult);
render();
</script>
