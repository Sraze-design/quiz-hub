let lang='hi';
const app=document.getElementById('app');
const hiBtn=document.getElementById('hiBtn'), enBtn=document.getElementById('enBtn');
function render(){
  app.innerHTML='';
  data.forEach((d,idx)=>{
    const card=document.createElement('section'); card.className='q';
    const q=document.createElement('div'); q.className='qt'; q.innerHTML=lang==='hi'?d.q_hi:d.q_en; card.appendChild(q);
    const tag=document.createElement('div'); tag.className='tag'; tag.textContent=d.tag; card.appendChild(tag);
    const opts=document.createElement('div'); opts.className='opts';
    (lang==='hi'?d.o_hi:d.o_en).forEach(x=>{const o=document.createElement('div');o.className='opt';o.textContent=x;opts.appendChild(o)}); card.appendChild(opts);
    const det=document.createElement('details'); const sum=document.createElement('summary'); sum.textContent=lang==='hi'?'उत्तर और व्याख्या':'Answer & Explanation'; det.appendChild(sum);
    const a=document.createElement('div'); a.className='ans'; a.textContent=(lang==='hi'?'Ans: ':'Answer: ')+(lang==='hi'?d.o_hi[d.a]:d.o_en[d.a]); det.appendChild(a);
    const ex=document.createElement('div'); ex.className='exp'; ex.innerHTML=lang==='hi'?d.e_hi:d.e_en; det.appendChild(ex); card.appendChild(det); app.appendChild(card);
  });
}
hiBtn.onclick=()=>{lang='hi';hiBtn.classList.add('active');enBtn.classList.remove('active');render()};
enBtn.onclick=()=>{lang='en';enBtn.classList.add('active');hiBtn.classList.remove('active');render()};
render();
</script>
