const KEY='railway-analogy-q1-q50-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}
let selected=Array.isArray(saved.selected)&&saved.selected.length===data.length?saved.selected.map(x=>Number.isInteger(x)&&x>=0&&x<4?x:null):Array(data.length).fill(null);
let current=Number.isInteger(saved.current)&&saved.current>=0&&saved.current<data.length?saved.current:0;
let finished=saved.finished===true;let language=['both','hi-only','en-only'].includes(saved.language)?saved.language:'both';
let revealed=Array.isArray(saved.revealed)&&saved.revealed.length===data.length?saved.revealed.map(Boolean):Array(data.length).fill(false);
const el=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify({selected,current,finished,language,revealed}))}catch{}}
function langBlock(hi,en){return '<div class="hindi" lang="hi"><span class="language-label">हिन्दी</span>'+hi+'</div><div class="english" lang="en"><span class="language-label">ENGLISH</span>'+en+'</div>'}
function render(){const q=data[current];el('language').value=language;el('tag').textContent=q.tag;
el('status').textContent=(current+1)+' / '+data.length+' · '+selected.filter(x=>x!==null).length+' answered';el('question').className='question '+language;el('question').innerHTML=langBlock(q.q_hi,q.q_en);
el('options').innerHTML='';for(let i=0;i<4;i++){const label=document.createElement('label');label.className='option'+(selected[current]===i?' selected':'')+((finished||revealed[current])&&q.a===i?' correct':'')+((finished||revealed[current])&&selected[current]===i&&q.a!==null&&q.a!==i?' wrong':'');const input=document.createElement('input');input.type='radio';input.name='answer';input.value=i;input.checked=selected[current]===i;input.disabled=finished;input.setAttribute('aria-label','Option '+String.fromCharCode(65+i));input.addEventListener('change',()=>{selected[current]=i;save();render()});const content=document.createElement('div');content.className=language;content.innerHTML=q.o_hi[i]===q.o_en[i]?q.o_hi[i]:langBlock(q.o_hi[i],q.o_en[i]);label.append(input,content);el('options').append(label)}
el('prev').disabled=current===0;el('next').disabled=current===data.length-1;el('clear').disabled=finished||selected[current]===null;
el('solution').hidden=!(finished||revealed[current]);el('solution').className='solution '+language;el('solution').innerHTML='<h2>हल / Solution</h2>'+langBlock(q.e_hi,q.e_en);
el('reveal').disabled=finished||revealed[current];el('nav').innerHTML='';data.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.setAttribute('aria-label','Go to Q'+(i+1));if(i===current)b.setAttribute('aria-current','true');b.className=(i===current?'current ':'')+(selected[i]!==null?'answered ':'')+(revealed[i]?'reviewed':'');b.onclick=()=>{current=i;save();render()};el('nav').append(b)});
el('results').hidden=!finished;el('submit').disabled=finished;if(finished){let correct=0,wrong=0,skipped=0;data.forEach((q,i)=>{if(selected[i]===null)skipped++;else if(q.a!==null){if(q.a===selected[i])correct++;else wrong++}});el('results').innerHTML='<h2>Score: '+correct+' / '+data.filter(q=>q.a!==null).length+'</h2><div>सही / Correct: '+correct+' · गलत / Incorrect: '+wrong+' · छोड़े / Unanswered: '+skipped+'</div><div>Solutions viewed before finishing: '+revealed.filter(Boolean).length+'</div>'}}
el('prev').onclick=()=>{if(current>0){current--;save();render()}};el('next').onclick=()=>{if(current<data.length-1){current++;save();render()}};
el('clear').onclick=()=>{selected[current]=null;save();render()};el('reveal').onclick=()=>{revealed[current]=true;save();render()};el('language').onchange=e=>{language=e.target.value;save();render()};
let pending=null;function ask(text,fn){el('confirmText').textContent=text;pending=fn;el('confirm').showModal()}
el('cancelConfirm').onclick=()=>el('confirm').close();el('acceptConfirm').onclick=()=>{el('confirm').close();if(pending)pending()};
el('submit').onclick=()=>ask('टेस्ट समाप्त करके परिणाम देखें? / Finish and view your result?',()=>{finished=true;save();render();el('results').scrollIntoView({behavior:'smooth'})});
el('reset').onclick=()=>ask('सभी उत्तर हटाकर फिर शुरू करें? / Clear all answers and restart?',()=>{selected=Array(data.length).fill(null);revealed=Array(data.length).fill(false);current=0;finished=false;save();render()});
render();
